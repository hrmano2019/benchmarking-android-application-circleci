version: 2.1

jobs:
  # --- Benchmark Node/TS Scripts ---
  benchmark-node:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: 📱 Benchmark Android/iOS Apps (JS)
          command: node benchmark-optimization.js
      - run:
          name: 📱 Benchmark Android/iOS Apps (TS)
          command: ts-node mobile-ci-optimization.ts

  # --- Supabase/Postgres Migrations ---
  db-migrate:
    docker:
      - image: cimg/postgres:14.5
    working_directory: ~/project/sql
    steps:
      - checkout
      - run:
          name: Apply schema
          command: psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f Schema.sql
      - run:
          name: Apply anomaly script
          command: psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f anomaly.sql
      - run:
          name: Apply telemetry script
          command: psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f telemetry.sql

  # --- Heavy Benchmarking Job (Android) ---
  android_performance_benchmark:
    docker:
      - image: cimg/android:2023.04
    steps:
      - checkout
      # STEP 1: Execute the Performance Tests
      - run:
          name: Run Deep Performance Tests and Collect Data
          command: ./gradlew measurePerformanceDebug
      # STEP 2: Analyze and Upload Metrics
      - run:
          name: Analyze and Upload Performance Metrics
          command: |
            PERF_DATA_FILE="app/build/perf/benchmark_results.json"
            STARTUP_TIME=$(jq '.metrics.startup_time' $PERF_DATA_FILE)
            JANK_FRAMES=$(jq '.metrics.jank_frames' $PERF_DATA_FILE)
            CURRENT_BRANCH="${CIRCLE_BRANCH}"
            COMMIT_SHA="${CIRCLE_SHA1}"

            BASELINE_TIME=1500
            THRESHOLD=1.10

            if [ $(echo "$STARTUP_TIME > ($BASELINE_TIME * $THRESHOLD)" | bc -l) -eq 1 ]; then
              echo "🚨 PERFORMANCE REGRESSION DETECTED!"
              exit 1
            else
              echo "Performance within acceptable limits."
            fi

            echo "Uploading metrics to monitoring dashboard..."
            curl -X POST $METRICS_API_ENDPOINT \
              -H "Content-Type: application/json" \
              --data "{\"branch\": \"$CURRENT_BRANCH\", \"commit\": \"$COMMIT_SHA\", \"startup_ms\": $STARTUP_TIME, \"jank_frames\": $JANK_FRAMES}"
      - store_artifacts:
          path: app/build/perf

workflows:
  version: 2
  hybrid-pipeline:
    jobs:
      - benchmark-node
      - db-migrate
      - android_performance_benchmark:
          requires:
            - db-migrate
