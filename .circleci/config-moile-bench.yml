jobs:
  # --- Heavy Benchmarking Job (Modified) ---
  android_performance_benchmark:
    executor: heavy_executor
    steps:
      - checkout
      # ... other setup steps (restore AVD cache, dependencies) ...

      # STEP 1: Execute the Performance Tests
      - run:
          name: Run Deep Performance Tests and Collect Data
          # This command executes the tests AND writes the results (e.g., startup time) 
          # to a well-known JSON file.
          command: ./gradlew measurePerformanceDebug
      
      # STEP 2: Custom Script to Analyze and Upload Metrics
      - run:
          name: Analyze and Upload Performance Metrics
          command: |
            # 1. READ DATA: Use a Python or shell script to parse the output JSON/XML file
            PERF_DATA_FILE="app/build/perf/benchmark_results.json"
            STARTUP_TIME=$(cat $PERF_DATA_FILE | jq '.metrics."startup_time"')
            JANK_FRAMES=$(cat $PERF_DATA_FILE | jq '.metrics."jank_frames"')
            CURRENT_BRANCH="${CIRCLE_BRANCH}"
            COMMIT_SHA="${CIRCLE_SHA1}"

            # 2. CHECK FOR REGRESSION (Dynamic Failure)
            # Fetch the baseline performance value from a reference (e.g., main branch's last run)
            BASELINE_TIME=1500 # Assume baseline is 1500ms
            THRESHOLD=1.10    # Allow 10% deviation

            if [ $(echo "$STARTUP_TIME > ($BASELINE_TIME * $THRESHOLD)" | bc -l) -eq 1 ]; then
              echo "🚨 PERFORMANCE REGRESSION DETECTED!"
              echo "Startup time ($STARTUP_TIME ms) exceeds baseline ($BASELINE_TIME ms) by more than 10%."
              # Fail the build dynamically to prevent regression from merging
              exit 1 
            else
              echo "Performance within acceptable limits."
            fi
            
            # 3. PUSH DATA TO RPM TOOL
            # Send the metrics to your monitoring tool's API endpoint
            echo "Uploading metrics to monitoring dashboard..."
            curl -X POST $METRICS_API_ENDPOINT \
                 -H "Content-Type: application/json" \
                 --data "{\"branch\": \"$CURRENT_BRANCH\", \"commit\": \"$COMMIT_SHA\", \"startup_ms\": $STARTUP_TIME, \"jank_frames\": $JANK_FRAMES}"

      - store_artifacts:
          path: app/build/perf
